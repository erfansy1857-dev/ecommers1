<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Store Elektronik</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header Navbar Toko -->
    <header class="navbar bg-primary text-white sticky-top">
        <div class="logo">📱 E-Store</div>
        <nav class="nav-links">
            <a href="#" class="nav-item active" onclick="switchCustomerTab(event, 'katalog')">Katalog</a>
            <a href="#" class="nav-item" onclick="switchCustomerTab(event, 'flashsale')">Flash Sale⚡</a>
            <a href="#" class="nav-item" onclick="switchCustomerTab(event, 'keranjang')">Keranjang (<span id="cart-count">0</span>)</a>
        </nav>
    </header>

    <div class="container mt-2 mb-4">

        <!-- TAB KATALOG -->
        <section id="tab-katalog" class="tab-content">
            <!-- Pencarian & Filter -->
            <div class="search-filter-box mb-2">
                <input type="text" id="search-input" class="form-control mb-1" placeholder="Cari nama produk..." oninput="filterProducts()">
                <div class="category-buttons">
                    <button type="button" class="btn btn-sm btn-category active" onclick="filterCategory(event, 'Semua')">Semua</button>
                    <button type="button" class="btn btn-sm btn-category" onclick="filterCategory(event, 'HP')">HP</button>
                    <button type="button" class="btn btn-sm btn-category" onclick="filterCategory(event, 'Laptop')">Laptop</button>
                    <button type="button" class="btn btn-sm btn-category" onclick="filterCategory(event, 'TV')">TV</button>
                    <button type="button" class="btn btn-sm btn-category" onclick="filterCategory(event, 'Aksesori')">Aksesori</button>
                </div>
            </div>

            <!-- Produk Terpopuler (Stok Paling Sedikit) -->
            <div id="section-populer" class="mb-3">
                <h3 class="text-danger mb-1">🔥 Produk Terpopuler (Stok Terbatas)</h3>
                <div class="grid-4 gap-2" id="grid-populer">
                    <!-- Data diisi JS -->
                </div>
            </div>

            <hr class="mb-2">

            <!-- Semua Produk -->
            <h3>Semua Produk</h3>
            <div class="grid-4 gap-2 mt-1" id="grid-produk">
                <!-- Data diisi JS -->
            </div>
        </section>

        <!-- TAB FLASH SALE -->
        <section id="tab-flashsale-cust" class="tab-content hidden">
            <h2 class="text-danger mb-2">⚡ Promo Flash Sale Hari Ini!</h2>
            <div class="grid-4 gap-2" id="grid-flashsale">
                <!-- Data diisi JS -->
            </div>
        </section>

        <!-- TAB KERANJANG & CHECKOUT -->
        <section id="tab-keranjang" class="tab-content hidden">
            <h2>Keranjang Belanja</h2>
            <div class="grid-2-custom gap-2 mt-2">
                <!-- Daftar Item Keranjang -->
                <div class="card">
                    <h3>Daftar Barang</h3>
                    <div id="cart-items-list" class="mt-1">
                        <!-- Items diisi JS -->
                    </div>
                    <hr class="mt-2 mb-1">
                    <div class="flex-between">
                        <strong>Total Pembayaran:</strong>
                        <strong id="cart-total-price" class="text-primary fs-large">Rp 0</strong>
                    </div>
                </div>

                <!-- Form Checkout -->
                <div class="card">
                    <h3>Data Pengiriman</h3>
                    <form id="form-checkout" onsubmit="handleCheckout(event)" class="mt-1">
                        <div class="form-group mb-1">
                            <label>Nama Lengkap</label>
                            <input type="text" id="cust-nama" class="form-control" placeholder="Nama Anda" required>
                        </div>
                        <div class="form-group mb-1">
                            <label>No. Telepon / Whatsapp</label>
                            <input type="tel" id="cust-phone" class="form-control" placeholder="08123456789" required>
                        </div>
                        <div class="form-group mb-1">
                            <label>Alamat Lengkap</label>
                            <textarea id="cust-alamat" class="form-control" rows="3" placeholder="Jl. Anggrek No. 123..." required></textarea>
                        </div>
                        <button type="submit" class="btn btn-success btn-block mt-2">Buat Pesanan (Checkout)</button>
                    </form>
                </div>
            </div>
        </section>

    </div>

    <script src="js/script.js"></script>
</body>
</html>
