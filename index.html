<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroStore - Toko Elektronik & HP</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark pb-bottom-nav">

    <!-- Header Atas Pelanggan -->
    <header class="top-header">
        <div class="header-container">
            <h2 class="brand-logo">📱 Electro<span>Store</span></h2>
            <a href="login.html" class="btn btn-sm btn-outline-light">Ganti User</a>
        </div>
    </header>

    <main class="container mt-3">

        <!-- TAB 1: CATALOG DASHBOARD -->
        <section id="user-tab-home" class="user-tab-content active">
            <!-- Pencarian & Filter -->
            <div class="search-box mb-3">
                <input type="text" id="searchInput" class="form-control" placeholder="Cari HP, Laptop, atau Aksesori..." onkeyup="filterUserProducts()">
            </div>

            <div class="category-scroll mb-3">
                <button class="btn-cat active" onclick="setCategoryFilter('Semua', this)">Semua</button>
                <button class="btn-cat" onclick="setCategoryFilter('HP', this)">HP</button>
                <button class="btn-cat" onclick="setCategoryFilter('Laptop', this)">Laptop</button>
                <button class="btn-cat" onclick="setCategoryFilter('TV', this)">TV</button>
                <button class="btn-cat" onclick="setCategoryFilter('Aksesori', this)">Aksesori</button>
                <button class="btn-cat" onclick="setCategoryFilter('Audio', this)">Audio</button>
            </div>

            <!-- Produk Terpopuler -->
            <div id="popularSection">
                <h3 class="section-title">🔥 Produk Terpopuler</h3>
                <div id="popularGrid" class="product-grid mb-4">
                    <!-- Controlled by JS -->
                </div>
            </div>

            <!-- Semua / Catalog Produk -->
            <h3 class="section-title">Katalog Produk</h3>
            <div id="userProductGrid" class="product-grid">
                <!-- Controlled by JS -->
            </div>
        </section>

        <!-- TAB 2: FLASH SALE -->
        <section id="user-tab-flashsale" class="user-tab-content">
            <div class="flash-header card mb-3">
                <h2>⚡ Flash Sale Hari Ini!</h2>
                <p>Harga termurah waktu terbatas. Buruan sebelum kehabisan!</p>
            </div>
            <div id="userFlashGrid" class="product-grid">
                <!-- Controlled by JS -->
            </div>
        </section>

        <!-- TAB 3: KERANJANG & CHECKOUT -->
        <section id="user-tab-cart" class="user-tab-content">
            <h3 class="section-title">Keranjang Belanja</h3>
            <div id="cartItemsContainer" class="cart-list mb-3">
                <!-- Controlled by JS -->
            </div>

            <div class="card checkout-card">
                <h4>Form Checkout Pemesanan</h4>
                <form id="checkoutForm" onsubmit="handleCheckout(event)">
                    <div class="form-group">
                        <label>Nama Lengkap</label>
                        <input type="text" id="custName" class="form-control" required placeholder="Contoh: Budi Santoso">
                    </div>
                    <div class="form-group">
                        <label>Nomor WhatsApp / Telp</label>
                        <input type="tel" id="custPhone" class="form-control" required placeholder="Contoh: 08123456789">
                    </div>
                    <div class="form-group">
                        <label>Alamat Pengiriman Lengkap</label>
                        <textarea id="custAddress" class="form-control" rows="2" required placeholder="Jl. Anggrek No. 12..."></textarea>
                    </div>

                    <div class="cart-summary flex-between mb-3">
                        <span>Total Pembayaran:</span>
                        <strong id="cartTotalPrice" class="text-accent fs-12">Rp 0</strong>
                    </div>

                    <button type="submit" class="btn btn-accent btn-block btn-lg">Bayar Sekarang</button>
                </form>
            </div>
        </section>

    </main>

    <!-- POPUP MODAL DETAIL PRODUK -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeDetailModal()">&times;</span>
            <div id="detailContent">
                <!-- Controlled by JS -->
            </div>
        </div>
    </div>

    <!-- NAVBAR BAWAH (MOBILE NAVIGATION) -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchUserTab('home', this)">
            <span class="nav-icon">🏠</span>
            <span class="nav-label">Dashboard</span>
        </button>
        <button class="nav-item" onclick="switchUserTab('flashsale', this)">
            <span class="nav-icon">⚡</span>
            <span class="nav-label">Flash Sale</span>
        </button>
        <button class="nav-item" onclick="switchUserTab('cart', this)">
            <span class="nav-icon">🛒</span>
            <span class="nav-label">Keranjang</span>
            <span id="cartBadge" class="badge-count">0</span>
        </button>
    </nav>

    <script src="js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initDefaultData();
            renderUserProducts();
            renderUserFlashSales();
            renderCart();
            startFlashTimers();
        });
    </script>
</body>
</html>
