<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toko Online - Pelanggan</title>
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Sticky Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">TokoKita</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link active" id="nav-dash-link" href="#" onclick="showSection('dashboard')">Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" id="nav-flash-link" href="#" onclick="showSection('flashsale')">Flash Sale</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" id="nav-cart-link" href="#" onclick="showSection('keranjang')">
              Keranjang <span class="badge bg-danger" id="cartCount">0</span>
            </a>
          </li>
          <li class="nav-item ms-lg-2">
            <button onclick="logout()" class="btn btn-outline-light btn-sm mt-1 mt-lg-0">Keluar</button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">

    <!-- SEKSI DASHBOARD -->
    <section id="sec-dashboard">
      <div class="row mb-4 align-items-center">
        <div class="col-md-6 mb-2 mb-md-0">
          <input type="text" id="searchInput" class="form-control" placeholder="Cari Produk..." onkeyup="filterProduk()">
        </div>
        <div class="col-md-6 text-md-end" id="categoryButtons">
          <!-- Filter Kategori diisi via JS -->
        </div>
      </div>

      <!-- Produk Terpopuler (4 Produk Pertama) -->
      <h4 class="fw-bold mb-3">Produk Terpopuler</h4>
      <div class="row g-3 mb-5" id="popularProductsContainer"></div>

      <!-- Semua Produk -->
      <h4 class="fw-bold mb-3">Semua Produk</h4>
      <div class="row g-3" id="allProductsContainer"></div>
    </section>

    <!-- SEKSI FLASH SALE -->
    <section id="sec-flashsale" class="d-none">
      <h3 class="fw-bold mb-4 text-danger">Promo Flash Sale 🔥</h3>
      <div class="row g-3" id="flashSaleContainer"></div>
    </section>

    <!-- SEKSI KERANJANG & CHECKOUT -->
    <section id="sec-keranjang" class="d-none">
      <h3 class="fw-bold mb-4">Keranjang Belanja</h3>
      <div class="row">
        <div class="col-lg-8 mb-4">
          <div class="card shadow-sm p-3">
            <div class="table-responsive">
              <table class="table align-middle">
                <thead>
                  <tr>
                    <th>Produk</th>
                    <th>Harga</th>
                    <th>Aksi</th>
                  </tr>
                </thead>
                <tbody id="cartTableBody"></tbody>
              </table>
            </div>
            <div class="text-end fw-bold fs-5 mt-2">
              Total: Rp <span id="cartTotal">0</span>
            </div>
          </div>
        </div>

        <div class="col-lg-4">
          <div class="card shadow-sm p-3">
            <h5 class="fw-bold mb-3">Form Checkout</h5>
            <form id="checkoutForm" onsubmit="handleCheckout(event)">
              <div class="mb-3">
                <label class="form-label">Nama Lengkap</label>
                <input type="text" id="custNama" class="form-control" required>
              </div>
              <div class="mb-3">
                <label class="form-label">No Telepon</label>
                <input type="tel" id="custTelp" class="form-control" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Alamat Lengkap</label>
                <textarea id="custAlamat" class="form-control" rows="3" required></textarea>
              </div>
              <button type="submit" class="btn btn-success w-100">Checkout Sekarang</button>
            </form>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
