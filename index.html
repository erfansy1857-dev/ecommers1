<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>E-Commerce</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>
<body>

<!-- ==========================
     NAVBAR
========================== -->

<nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">

<div class="container">

<a class="navbar-brand fw-bold" href="#">
🛒 E-Commerce
</a>

<button class="navbar-toggler"
type="button"
data-bs-toggle="collapse"
data-bs-target="#menu">

<span class="navbar-toggler-icon"></span>

</button>

<div class="collapse navbar-collapse" id="menu">

<ul class="navbar-nav ms-auto">

<li class="nav-item">
<a class="nav-link active" href="#dashboard">
Dashboard
</a>
</li>

<li class="nav-item">
<a class="nav-link" href="#flashsale">
Flash Sale
</a>
</li>

<li class="nav-item">
<a class="nav-link" href="#keranjang">
Keranjang
</a>
</li>

<li class="nav-item ms-lg-3">
<button
class="btn btn-danger btn-sm"
onclick="logout()">
Logout
</button>
</li>

</ul>

</div>

</div>

</nav>

<div class="container my-4">

<!-- ==========================
     DASHBOARD
========================== -->

<section id="dashboard">

<h2 class="mb-4">
Dashboard
</h2>

<div class="row">

<div class="col-md-8 mb-3">

<input
type="text"
id="search"
class="form-control"
placeholder="Cari Produk...">

</div>

<div class="col-md-4 mb-3">

<select
id="filterKategori"
class="form-select">

<option value="Semua">
Semua Kategori
</option>

</select>

</div>

</div>

<h4 class="mb-3">
Produk Terpopuler
</h4>

<div
class="row"
id="produkContainer">

<!-- Produk muncul dari JavaScript -->

</div>

</section>

<hr class="my-5">

<!-- ==========================
     FLASH SALE
========================== -->

<section id="flashsale">

<div class="d-flex justify-content-between align-items-center mb-3">

<h2>
🔥 Flash Sale
</h2>

<span class="badge bg-danger">
Diskon Terbatas
</span>

</div>

<div
class="row"
id="flashContainer">

<!-- Flash Sale dari JS -->

</div>

</section>

<hr class="my-5">
<!-- ==========================
     KERANJANG
========================== -->

<section id="keranjang">

<h2 class="mb-4">
🛒 Keranjang
</h2>

<div id="cartContainer">

<div class="empty">
Keranjang masih kosong.
</div>

</div>

<div class="row mt-4">

<div class="col-lg-8">

<div class="card">

<div class="card-body">

<h5 class="mb-3">
Data Pemesan
</h5>

<div class="mb-3">
<label class="form-label">Nama</label>
<input
type="text"
id="nama"
class="form-control"
placeholder="Masukkan Nama">
</div>

<div class="mb-3">
<label class="form-label">No Telepon</label>
<input
type="tel"
id="telepon"
class="form-control"
placeholder="08xxxxxxxxxx">
</div>

<div class="mb-3">
<label class="form-label">Alamat</label>
<textarea
id="alamat"
rows="4"
class="form-control"
placeholder="Masukkan Alamat"></textarea>
</div>

</div>

</div>

</div>

<div class="col-lg-4">

<div class="total-box">

<h4>Total Belanja</h4>

<hr>

<h3 class="text-success" id="totalHarga">
Rp0
</h3>

<div class="d-grid mt-3">

<button
class="btn btn-success btn-lg"
onclick="checkout()">

Checkout

</button>

</div>

</div>

</div>

</div>

</section>

</div>

<footer>

<p class="mb-0">
© 2026 Simple E-Commerce
</p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="script.js"></script>

</body>
</html>
