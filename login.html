<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - E-Commerce</title>
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

  <div class="container">
    <div class="card shadow-lg login-container p-4">
      <div class="text-center mb-4">
        <h3 class="fw-bold text-primary">Toko Online</h3>
        <p class="text-muted">Silakan pilih akses masuk Anda</p>
      </div>

      <!-- Form Login Admin -->
      <form id="formAdmin" class="mb-3">
        <div class="mb-3">
          <label class="form-label">Username Admin</label>
          <input type="text" id="adminUser" class="form-control" placeholder="Masukkan username">
        </div>
        <div class="mb-3">
          <label class="form-label">Password Admin</label>
          <input type="password" id="adminPass" class="form-control" placeholder="Masukkan password">
        </div>
        <button type="button" onclick="loginAdmin()" class="btn btn-primary w-100 mb-2">Login Admin</button>
      </form>

      <hr class="my-3">

      <!-- Tombol Masuk Pelanggan -->
      <button onclick="masukPelanggan()" class="btn btn-outline-success w-100">Masuk Sebagai Pelanggan</button>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
