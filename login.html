<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - E-Commerce</title>
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-4">

  <div class="container d-flex justify-content-center">
    <div class="card shadow-lg login-container p-4" style="max-width: 420px; width: 100%;">
      <div class="text-center mb-4">
        <h3 class="fw-bold text-primary">Toko Online</h3>
        <p class="text-muted">Silakan pilih akses masuk Anda</p>
      </div>

      <!-- Form Login Admin -->
      <form id="formAdmin" onsubmit="event.preventDefault(); loginAdmin();">
        <div class="mb-3">
          <label for="adminUser" class="form-label">Username Admin</label>
          <input type="text" id="adminUser" class="form-control" placeholder="Masukkan username" required>
        </div>
        <div class="mb-3">
          <label for="adminPass" class="form-label">Password Admin</label>
          <input type="password" id="adminPass" class="form-control" placeholder="Masukkan password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 mb-2">Login Admin</button>
      </form>

      <div class="position-relative my-4 text-center">
        <hr class="text-muted">
        <span class="position-absolute top-50 start-50 translate-middle bg-white px-2 text-muted small">atau</span>
      </div>

      <!-- Tombol Masuk Pelanggan -->
      <button type="button" onclick="masukPelanggan()" class="btn btn-outline-success w-100">
        Masuk Sebagai Pelanggan
      </button>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
