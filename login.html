<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Toko Elektronik</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray center-flex">

    <div class="card login-card">
        <h2 class="text-center text-primary mb-2">E-Store Elektronik</h2>
        <p class="text-center text-muted mb-3">Pilih Mode Masuk Aplikasi</p>

        <!-- Pilihan Mode Login -->
        <div id="login-selection" class="flex-col gap-2">
            <button type="button" class="btn btn-primary btn-block" onclick="showAdminForm()">Login Admin</button>
            <button type="button" class="btn btn-secondary btn-block" onclick="loginAsCustomer()">Masuk Sebagai Pelanggan</button>
        </div>

        <!-- Form Admin (Default Tersembunyi) -->
        <form id="admin-form" class="hidden flex-col gap-2 mt-2" onsubmit="handleAdminLogin(event)">
            <h3 class="text-center mb-1">Form Login Admin</h3>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" class="form-control" placeholder="Masukkan username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Masukkan password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Masuk Admin</button>
            <button type="button" class="btn btn-outline btn-block mt-1" onclick="hideAdminForm()">Kembali</button>
        </form>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
